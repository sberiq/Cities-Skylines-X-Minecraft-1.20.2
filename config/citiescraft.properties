# One pair of corresponding anchors links a Minecraft location to a Cities location.
# Edit both origins at the chosen landmarks before starting the Bridge.
world.scale=1.0
world.yaw-offset-degrees=0.0
world.minecraft-origin-x=0.0
world.minecraft-origin-y=64.0
world.minecraft-origin-z=0.0
world.cities-origin-x=0.0
world.cities-origin-y=0.0
world.cities-origin-z=0.0

# City terrain/building collision is sent only around the mapped Minecraft player.
collision.radius-cities-units=96.0
